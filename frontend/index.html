<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Permite instalar FriBuk como app desde el navegador. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="FriBuk" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FriBuk: lee, escribe y descubre historias y fanfics creados por personas que tienen algo que contar."
    />
    <!-- Color de la barra del navegador en el teléfono, según el modo del sistema. -->
    <meta name="theme-color" content="#f3f0ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1919" media="(prefers-color-scheme: dark)" />
    <!-- Vista previa al compartir el enlace. En las páginas de historias y
         capítulos, la función de Cloudflare reemplaza estos valores. -->
    <meta property="og:site_name" content="FriBuk" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FriBuk" />
    <meta
      property="og:description"
      content="FriBuk: lee, escribe y descubre historias y fanfics creados por personas que tienen algo que contar."
    />
    <meta property="og:image" content="https://www.fribuk.com/logo-fribuk.jpg" />
    <meta name="twitter:card" content="summary" />
    <title>FriBuk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
